<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Shop | OLF</title></head><body>
<section class="hero" style="padding-bottom:10px"><h1>Apparel Shop</h1><p>Shoes, ladies wear and more from Istanbul. Add to cart and order via WhatsApp.</p></section>
<section class="sec"><div class="chips" id="chips"></div><div class="grid" id="prods"></div></section>
<button class="btn" id="cartBtn" onclick="openCart()">🛒 Cart (<span id="cn">0</span>)</button>
<aside id="cart"><div class="mh"><h2>Your cart</h2><button class="x" onclick="closeCart()">×</button></div><div id="lines"></div><p style="margin:12px 0"><b>Total: <span id="tot">$0</span></b></p>
<form id="co"><input name="name" placeholder="Full name" required><input name="phone" placeholder="Phone / WhatsApp" required><textarea name="addr" rows="2" placeholder="Delivery address and country" required></textarea><button class="btn" style="width:100%">Place order on WhatsApp</button></form></aside>
<script src="js/content.js"></script><script src="js/main.js"></script><script src="js/shop.js"></script></body></html>
