<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/style.css"><title>Book | OLF</title></head><body>
<form class="box" id="bookForm"><h2>Book a service</h2>
<input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="phone" placeholder="Phone / WhatsApp" required>
<fieldset><legend>Choose service(s)</legend><div id="checks"></div></fieldset>
<textarea name="note" rows="3" placeholder="Details (items, weight, destination...)"></textarea>
<button class="btn" style="width:100%">Send booking via WhatsApp</button>
<p id="done" hidden style="margin-top:12px">Opened WhatsApp. Prefer email? <a id="mailAlt" style="color:#2a52be;text-decoration:underline">Send by email instead</a></p></form>
<script src="js/content.js"></script><script src="js/main.js"></script></body></html>
