<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#1b2b48"><meta name="description" content="Create and print a QR code that opens the OLF website, a page or a WhatsApp chat."><meta property="og:title" content="QR codes | OLF"><meta property="og:description" content="Create and print a QR code that opens the OLF website, a page or a WhatsApp chat."><meta property="og:type" content="website"><meta property="og:url" content="https://kuroihirohamada.github.io/olf-website/qr.html"><link rel="stylesheet" href="css/style.css"><title>QR codes | OLF</title></head><body><section class="hero"><h1>QR codes</h1><p>Print a QR code for your flyers, cards and shop window, or scan one to open the site on your phone.</p></section>
<section class="sec"><div class="calc"><div class="box noprint" style="max-width:none;margin:0"><h2>What should the QR code open?</h2>
<label class="fl">Quick links<select id="qpre"></select></label><label class="fl">Link<input id="qurl" type="url"></label><label class="fl">Text under the code<input id="qcap"></label>
<label class="fl">Size<select id="qsz"><option value="260">Small</option><option value="360" selected>Medium</option><option value="520">Large</option></select></label>
<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="qdl">Download PNG</button><button class="btn btn-accent" id="qpr">Print</button></div></div>
<div class="printcard" id="qcard"><div class="brand" id="qbrand"></div><canvas id="qc"></canvas><p id="qtext"></p><small id="qlink"></small></div></div></section>
